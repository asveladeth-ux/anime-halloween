<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#28134d"><title>คำชวนพิเศษ 🌸</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:system-ui,-apple-system,sans-serif;color:white;background:#24123f url('assets/background.png') center/cover fixed no-repeat;display:grid;place-items:center;padding:24px}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(22,8,45,.66),rgba(22,8,45,.12)),linear-gradient(0deg,rgba(18,8,35,.38),transparent 60%);pointer-events:none}
main{position:relative;width:min(100%,520px);margin:auto;padding:clamp(24px,6vw,42px);border:1px solid #ffffff55;border-radius:28px;background:#24123f88;backdrop-filter:blur(9px);box-shadow:0 20px 70px #12072288;text-align:center}
.tag{letter-spacing:.14em;color:#ffd6f4;font-size:.78rem}h1{font-size:clamp(2rem,8vw,3.2rem);line-height:1.15;margin:14px 0;color:#fff0fa;text-shadow:0 3px 20px #ff58c7aa}p{font-size:1.15rem;line-height:1.7;margin:14px 0 26px}.buttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}button{border:0;border-radius:999px;padding:13px 30px;font-size:1.1rem;font-weight:700;cursor:pointer;color:white;background:linear-gradient(135deg,#ff55ca,#9d4dff);box-shadow:0 6px 25px #ff55ca66}button.no{background:#ffffff22;border:1px solid #ffffff99;box-shadow:none}.music{margin-top:24px;font-size:.9rem;color:#f6dff3}.music button{padding:8px 17px;font-size:.9rem;margin-left:8px}.answer{min-height:2em;margin-top:18px;color:#ffe1f6;font-weight:600}
</style></head>
<body><main>
<div class="tag">A LITTLE MESSAGE FOR YOU ✨</div>
<h1>มีอะไรอยากบอกนะ 🌸</h1>
<p>อยากลองเริ่มต้นเรื่องราวดี ๆ ไปด้วยกันไหม?</p>
<div class="buttons"><button id="yes">♡ Yes</button><button class="no" id="no">No</button></div>
<div class="answer" id="answer" aria-live="polite"></div>
<div class="music">♫ เสียงประกอบจากวิดีโอของคุณ <button id="toggle" type="button">ปิดเสียง</button></div>
<audio id="bgm" src="assets/user-audio.mp3" loop preload="auto"></audio>
</main>
<script>
const audio=document.getElementById('bgm'), toggle=document.getElementById('toggle'), answer=document.getElementById('answer');
let started=false;
async function startLoop(){try{if(!started){audio.currentTime=0;started=true;} await audio.play();toggle.textContent='ปิดเสียง';}catch(e){answer.textContent='แตะปุ่มอีกครั้งเพื่ออนุญาตให้เล่นเสียงนะครับ';}}
document.getElementById('yes').addEventListener('click',async()=>{await startLoop();answer.textContent='เย้! ขอบคุณที่ตอบตกลงนะ 💗';});
document.getElementById('no').addEventListener('click',async()=>{await startLoop();answer.textContent='ไม่เป็นไรนะ ขอบคุณที่รับฟัง 💜';});
toggle.addEventListener('click',async()=>{if(audio.paused){await startLoop();}else{audio.pause();toggle.textContent='เปิดเสียง';}});
</script></body></html>
